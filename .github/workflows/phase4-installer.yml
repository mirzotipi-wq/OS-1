name: Phase 4 - OS-1 Real Installation on Virtual Disk

on:
  push:
    branches:
      - master
      - 'os1/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase4-clean-disk-install:
    name: Install OS-1 from UEFI Live ISO to Blank Disk & Verify 2 Reboots
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out OS-1 repository (shallow)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Free disk space on runner
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Install build, ISO, and QEMU/OVMF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bc \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            cpio \
            kmod \
            xz-utils \
            curl \
            busybox-static \
            mmdebstrap \
            debian-archive-keyring \
            e2fsprogs \
            dosfstools \
            mtools \
            squashfs-tools \
            xorriso \
            grub-efi-amd64-bin \
            grub-common \
            qemu-system-x86 \
            ovmf \
            gnupg \
            file

      - name: Run OS-1 repository audit (T0-AUDIT)
        run: ./distro/tools/os1.sh audit

      - name: Compute exact kernel source & toolchain cache key
        id: kkey
        run: |
          TREE_HASH="$(git rev-parse HEAD:distro/kernel HEAD:distro/tests/kernel-driver-audit.py | sha256sum | awk '{print $1}')"
          GCC_HASH="$(gcc --version | head -n 1 | sha256sum | awk '{print $1}')"
          echo "key=os1-kernel-lts-x86_64-v4-${TREE_HASH:0:20}-${GCC_HASH:0:12}" >> "$GITHUB_OUTPUT"

      - name: Restore cached OS-1 x86_64 kernel
        id: kernel-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: distro/out/kernel
          key: ${{ steps.kkey.outputs.key }}

      - name: Build OS-1 x86_64 kernel + modules if cache miss (T1-KBUILD)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: ./distro/tools/os1.sh kernel --with-modules

      - name: Build OS-1 UEFI Live ISO with os1-install embedded (T3-ISO-BUILD)
        run: sudo ./distro/tools/os1.sh iso

      - name: Run automated clean-disk install, ISO detach & 2-reboot test (T4-INSTALL)
        run: ./distro/tools/os1.sh install-test

      - name: Run automated LUKS2 full-disk encryption install & encrypted UEFI boot test (T25-LUKS)
        run: ./distro/tools/os1.sh luks-install-test

      - name: Run automated signed update, versioned kernel upgrade & GRUB rollback test (T20-UPDATE-ROLLBACK)
        run: OS1_UPDATE_DISK_GB=6 ./distro/tools/os1.sh update-rollback-test

      - name: Upload Phase 4 & 20 verification artifacts (bounded 7-day retention)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase4-install-evidence
          retention-days: 7
          path: |
            distro/out/iso/iso-provenance.json
            distro/out/logs/*.log
