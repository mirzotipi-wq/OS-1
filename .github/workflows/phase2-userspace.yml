name: Phase 2 - OS-1 Debian Userspace & Persistent Storage

on:
  push:
    branches:
      - master
      - 'os1/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-userspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase2-userspace-persistence:
    name: Build Debian Rootfs & Verify OS-1 Userspace Persistence in QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out OS-1 repository (shallow)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Free disk space on runner
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Install kernel, rootfs, and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bc \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            cpio \
            kmod \
            xz-utils \
            mmdebstrap \
            debian-archive-keyring \
            e2fsprogs \
            qemu-system-x86 \
            file

      - name: Run OS-1 repository audit (T0-AUDIT)
        run: ./distro/tools/os1.sh audit

      - name: Compute exact kernel source & toolchain cache key
        id: kkey
        run: |
          TREE_HASH="$(git rev-parse HEAD:Makefile HEAD:arch/x86 HEAD:drivers HEAD:kernel HEAD:mm HEAD:net HEAD:fs HEAD:include HEAD:distro/kernel HEAD:distro/tests/kernel-driver-audit.py | sha256sum | awk '{print $1}')"
          GCC_HASH="$(gcc --version | head -n 1 | sha256sum | awk '{print $1}')"
          echo "key=os1-kernel-x86_64-v3-${TREE_HASH:0:20}-${GCC_HASH:0:12}" >> "$GITHUB_OUTPUT"

      - name: Restore cached OS-1 x86_64 kernel (keyed on kernel source + fragment)
        id: kernel-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: distro/out/kernel
          key: ${{ steps.kkey.outputs.key }}

      - name: Build OS-1 x86_64 kernel + modules if cache miss (T1-KBUILD)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: ./distro/tools/os1.sh kernel --with-modules

      - name: Verify OS-1 kernel provenance
        run: cat distro/out/kernel/provenance.json

      - name: Build pinned Debian 12 OS-1 rootfs & persistent ext4 disk image (T2-ROOTFS-BUILD)
        run: sudo ./distro/tools/os1.sh rootfs

      - name: Run automated QEMU Phase 2 userspace, networking, APT & reboot persistence test (T2-ROOTFS)
        run: ./distro/tools/os1.sh userspace-test

      - name: Run automated QEMU Phase 17 behavioral firewall traffic & reboot test (T17-FIREWALL)
        run: ./distro/tools/os1.sh firewall-test

      - name: Upload Phase 2 & 17 verification artifacts (bounded 7-day retention)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase2-userspace-evidence
          retention-days: 7
          path: |
            distro/out/kernel/provenance.json
            distro/out/images/rootfs-provenance.json
            distro/out/images/rootfs-packages.tsv
            distro/out/logs/*.log
